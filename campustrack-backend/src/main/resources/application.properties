# ========================================================
# CampusTrack Student Management System Configuration
# ========================================================

# Server Port Configuration
server.port=8080

# Application Name
spring.application.name=campustrack-backend

# ========================================================
# MySQL Database Configuration
# ========================================================
# Database URL - automatically creates 'campustrack_db' if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/campustrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL Username (Default: root. Can be overridden via DB_USERNAME environment variable)
spring.datasource.username=${DB_USERNAME:root}

# MySQL Password Placeholder:
# Replace with your actual MySQL password or pass via DB_PASSWORD environment variable
spring.datasource.password=${DB_PASSWORD:123456789}

# ========================================================
# Spring Data JPA / Hibernate Configuration
# ========================================================
# Automatically validate and update database schema on startup
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console for easy debugging during viva/demonstration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
